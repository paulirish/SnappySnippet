<!DOCTYPE html>
<html>
<head>
  <title>Playing Card Style Test</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Roboto:wght@400;700&display=swap');

    :root {
      --card-width: 150px;
      --card-height: 225px;
      --red-suit-color: #ff4136;
      --black-suit-color: #222;
      --diamond-color: #00c9ff;
      --heart-color: #ff0055;
      --spade-color: #333;
      --club-color: #00a500;
    }

    body {
      display: flex;
      font-family: 'Roboto', sans-serif;
      background-color: #1a1a1d;
      color: #fff;
      padding: 20px;
      gap: 40px;
    }

    #card-container {
      width: 50%;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      perspective: 1000px;
    }

    #iframe-container {
      width: 50%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    iframe {
      flex-grow: 1;
      border: 2px solid #555;
      border-radius: 10px;
      background: #2b2b2e;
    }
    
    #iframe-controls button {
        background-color: #4CAF50; /* Green */
        border: none;
        color: white;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 0.3s;
    }
    #iframe-controls button:hover {
        background-color: #45a049;
    }

    :root {
            --bg: #0f0f11;
            --card-ratio: 1 / 1.5;
            --card-width: 260px;
            --glitter: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;

            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, #2a2a35, transparent 70%),
                radial-gradient(circle at 80% 90%, #1a1a20, transparent 50%);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            perspective: 1200px; /* Deep perspective for the fan effect */
        }

        .hand {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 40px;
        }

        .card {
            width: var(--card-width);
            aspect-ratio: var(--card-ratio);
            position: relative;
            border-radius: 24px;
            transform-style: preserve-3d;
            flex-shrink: 0;
            
            /* Fan Layout: Overlap cards */
            margin-left: -40px; 
            
            /* Default Physics (Overridden by inline styles) */
            --rx: 0deg;
            --ry: 0deg;
            --tx: 0px;
            --ty: 0px;
            --mx: 50%; /* Light position X */
            --my: 50%; /* Light position Y */
            --op: 1;   /* Opacity of effects */
            
            /* The Static Pose */
            transform: 
                rotateX(var(--rx)) 
                rotateY(var(--ry)) 
                translate3d(var(--tx), var(--ty), 0);
                
            box-shadow: 
                20px 30px 50px -10px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255,255,255,0.1) inset;
        }

        /* First card shouldn't pull left */
        .card:first-child { margin-left: 0; }

        /* --- LAYERS --- */
        
        .card__bg {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: rgba(30, 30, 35, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1;
            overflow: hidden;
        }

        .card__bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: var(--glitter);
            mix-blend-mode: overlay;
            opacity: 0.5;
        }

        /* Holographic Foil */
        .card__foil {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: 
                linear-gradient(
                    115deg, 
                    transparent 0%, 
                    rgba(255,255,255,0.3) 30%, 
                    rgba(255,0,150,0.4) 45%, 
                    rgba(0,200,255,0.4) 55%, 
                    transparent 70%
                );
            mix-blend-mode: color-dodge;
            opacity: var(--op);
            background-size: 200% 200%;
            background-position: var(--mx) var(--my);
            z-index: 2;
        }

        /* Specular Glare */
        .card__glare {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            z-index: 4;
            background: radial-gradient(
                farthest-corner at var(--mx) var(--my), 
                rgba(255,255,255,0.7) 0%, 
                rgba(255,255,255,0) 40%
            );
            opacity: var(--op);
            mix-blend-mode: overlay;
        }

        /* --- CONTENT --- */
        .card__content {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px;
            color: #fff;
            transform: translateZ(20px); /* Text floats off surface */
            box-sizing: border-box;
        }

        .card__val {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .card__suit { font-size: 0.8em; }

        .card__center {
            font-size: 4.5rem;
            align-self: center;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.3));
            background: linear-gradient(to bottom right, #fff, var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card__name {
            text-align: center;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.8;
            font-weight: 600;
            margin-top: -10px;
        }

        /* --- SUIT COLORS & VARIATIONS --- */
        .card[data-suit="spades"] { 
            --accent: #bd00ff; 
            background: linear-gradient(to bottom, #1a1a1a, #000); 
        }
        .card[data-suit="hearts"] { 
            --accent: #ff0055; 
            background: linear-gradient(to bottom, #29000f, #000);
        }
        .card[data-suit="diamonds"] { 
            --accent: #ffd700; 
            background: linear-gradient(to bottom, #1f1a00, #000);
        }
        .card[data-suit="clubs"] { 
            --accent: #00ff9d; 
            background: linear-gradient(to bottom, #001f13, #000);
        }
        .card[data-suit="joker"] { 
            --accent: #fff; 
            background: conic-gradient(from 0deg, #222, #111, #222); 
        }

  </style>
</head>
<body>

  <div id="card-container hand" style="
  flex-grow: 1;

  display: flex;
  flex-wrap: wrap;
">
  


    <div class="card" data-suit="spades" 
         style="--rx: 5deg; --ry: -25deg; --tx: 0px; --ty: 40px; --mx: 90%; --my: 10%; --op: 0.6;">
        <div class="card__bg"></div>
        <div class="card__foil"></div>
        <div class="card__glare"></div>
        <div class="card__content">
            <div class="card__val">A<span class="card__suit">♠</span></div>
            <div class="card__center">♠</div>
            <div class="card__val" style="transform: rotate(180deg); align-self: flex-end;">A<span class="card__suit">♠</span></div>
            <div class="card__name">Architect</div>
        </div>
    </div>

    <div class="card" data-suit="hearts" 
         style="--rx: 0deg; --ry: -15deg; --tx: 0px; --ty: 10px; --mx: 70%; --my: 30%; --op: 0.8;">
        <div class="card__bg"></div>
        <div class="card__foil"></div>
        <div class="card__glare"></div>
        <div class="card__content">
            <div class="card__val">K<span class="card__suit">♥</span></div>
            <div class="card__center">♥</div>
            <div class="card__val" style="transform: rotate(180deg); align-self: flex-end;">K<span class="card__suit">♥</span></div>
            <div class="card__name">Sovereign</div>
        </div>
    </div>

    <div class="card" data-suit="diamonds" 
         style="--rx: 10deg; --ry: 0deg; --tx: 0px; --ty: -10px; --mx: 50%; --my: 50%; --op: 1;">
        <div class="card__bg"></div>
        <div class="card__foil"></div>
        <div class="card__glare"></div>
        <div class="card__content">
            <div class="card__val">Q<span class="card__suit">♦</span></div>
            <div class="card__center">♦</div>
            <div class="card__val" style="transform: rotate(180deg); align-self: flex-end;">Q<span class="card__suit">♦</span></div>
            <div class="card__name">Oracle</div>
        </div>
    </div>

    <div class="card" data-suit="clubs" 
         style="--rx: 0deg; --ry: 15deg; --tx: 0px; --ty: 10px; --mx: 30%; --my: 30%; --op: 0.8;">
        <div class="card__bg"></div>
        <div class="card__foil"></div>
        <div class="card__glare"></div>
        <div class="card__content">
            <div class="card__val">J<span class="card__suit">♣</span></div>
            <div class="card__center">♣</div>
            <div class="card__val" style="transform: rotate(180deg); align-self: flex-end;">J<span class="card__suit">♣</span></div>
            <div class="card__name">Scout</div>
        </div>
    </div>

    <div class="card" data-suit="joker" 
         style="--rx: 20deg; --ry: 30deg; --tx: -10px; --ty: 50px; --mx: 10%; --my: 80%; --op: 0.7;">
        <div class="card__bg"></div>
        <div class="card__foil"></div>
        <div class="card__glare"></div>
        <div class="card__content">
            <div class="card__val">★</div>
            <div class="card__center">☺</div>
            <div class="card__val" style="transform: rotate(180deg); align-self: flex-end;">★</div>
            <div class="card__name">Chaos</div>
        </div>
    </div>





  </div>

  <div id="iframe-container">
    <iframe id="card-iframe"></iframe>
    <div id="iframe-controls">
      <button id="prev-btn">Previous</button>
      <button id="next-btn">Next</button>
    </div>
  </div>

  <script src="get-styles.js"></script>
  <script>
    const cards = Array.from(document.querySelectorAll('.card'));
    const iframe = document.getElementById('card-iframe');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let currentCardIndex = 0;

    function applyStyles(element, styleData) {
      for (const prop in styleData.styles) {
        element.style[prop] = styleData.styles[prop];
      }
      for (let i = 0; i < styleData.children.length; i++) {
        const childElement = element.children[i];
        const childStyleData = styleData.children[i];
        if (childElement && childStyleData) {
          applyStyles(childElement, childStyleData);
        }
      }
    }

    function updateIframe() {
      const card = cards[currentCardIndex];
      const cardStyles = getNonDefaultComputedStyles(card);
      const cardClone = card.cloneNode(true);
      
      const iframeDoc = iframe.contentDocument;
      iframeDoc.body.innerHTML = ''; // Clear previous content
      iframeDoc.body.style.cssText = `
      background-image:
      linear-gradient(45deg, #ccc 26%, transparent 26%), 
      linear-gradient(135deg, #ccc 26%, transparent 26%),
      linear-gradient(45deg, transparent 75%, #ccc 75%),
      linear-gradient(135deg, transparent 75%, #ccc 75%);
          background-size: 20px 20px; /* Must be a square */
          background-position: 0 0, 10px 0, 10px -10px, 0px 10px; /* Must be half of one side of the square */
      `
      iframeDoc.body.style.margin = '0';
      iframeDoc.body.style.display = 'flex';
      iframeDoc.body.style.justifyContent = 'center';
      iframeDoc.body.style.alignItems = 'center';
      iframeDoc.body.style.height = '100vh';


      iframeDoc.body.appendChild(cardClone);
      applyStyles(cardClone, cardStyles);
    }

    nextBtn.addEventListener('click', () => {
      currentCardIndex = (currentCardIndex + 1) % cards.length;
      updateIframe();
    });

    prevBtn.addEventListener('click', () => {
      currentCardIndex = (currentCardIndex - 1 + cards.length) % cards.length;
      updateIframe();
    });

    // Initial load
    iframe.onload = updateIframe;
  </script>

</body>
</html>
