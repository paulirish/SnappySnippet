<!DOCTYPE html>
<html>
<head>
  <title>Playing Card Style Test</title>
  <style>
    body {
      display: flex;
      font-family: sans-serif;
    }
    #card-container {
      width: 50%;
      display: flex;
      flex-wrap: wrap;
    }
    .card {
      border: 2px solid black;
      border-radius: 10px;
      width: 100px;
      height: 150px;
      margin: 10px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 3px 3px 5px rgba(0,0,0,0.3);
      transition: all 0.2s ease-in-out;
    }
    .card:hover {
      transform: scale(1.05);
    }
    .card .suit {
      font-size: 40px;
      text-align: center;
    }
    .card .rank {
      font-size: 30px;
      font-weight: bold;
    }
    .hearts .suit { color: red; }
    .diamonds .suit { color: red; }
    .clubs .suit { color: black; }
    .spades .suit { color: black; }

    #iframe-container {
      width: 50%;
      display: flex;
      flex-direction: column;
    }
    iframe {
      width: 100%;
      height: 400px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

  <div id="card-container">
    <div class="card hearts">
      <div class="rank">A</div>
      <div class="suit">&hearts;</div>
    </div>
    <div class="card diamonds">
      <div class="rank">K</div>
      <div class="suit">&diams;</div>
    </div>
    <div class="card clubs">
      <div class="rank">Q</div>
      <div class="suit">&clubs;</div>
    </div>
    <div class="card spades">
      <div class="rank">J</div>
      <div class="suit">&spades;</div>
    </div>
    <div class="card hearts">
      <div class="rank">10</div>
      <div class="suit">&hearts;</div>
    </div>
    <div class="card diamonds">
        <div class="rank">9</div>
        <div class="suit">&diams;</div>
    </div>
    <div class="card clubs">
        <div class="rank">8</div>
        <div class="suit">&clubs;</div>
    </div>
  </div>

  <div id="iframe-container">
    <iframe id="card-iframe"></iframe>
    <div>
      <button id="prev-btn">Previous</button>
      <button id="next-btn">Next</button>
    </div>
  </div>

  <script src="get-styles.js"></script>
  <script>
    const cards = Array.from(document.querySelectorAll('.card'));
    const iframe = document.getElementById('card-iframe');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    let currentCardIndex = 0;

    function applyStyles(element, styleData) {
      for (const prop in styleData.styles) {
        element.style[prop] = styleData.styles[prop];
      }
      for (let i = 0; i < styleData.children.length; i++) {
        applyStyles(element.children[i], styleData.children[i]);
      }
    }

    function updateIframe() {
      const card = cards[currentCardIndex];
      const cardStyles = getNonDefaultComputedStyles(card);

      iframe.srcdoc = card.outerHTML;

      iframe.onload = () => {
        const iframeCard = iframe.contentDocument.body.firstChild;
        applyStyles(iframeCard, cardStyles);
      };
    }

    nextBtn.addEventListener('click', () => {
      currentCardIndex = (currentCardIndex + 1) % cards.length;
      updateIframe();
    });

    prevBtn.addEventListener('click', () => {
      currentCardIndex = (currentCardIndex - 1 + cards.length) % cards.length;
      updateIframe();
    });

    // Initial load
    updateIframe();
  </script>

</body>
</html>
